<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>e-Karangan BM Tahun 4 SJKC</title><style>:root{--fs:18px;--line:#d8dee6;--ink:#18212b;--mut:#66717f;--blue:#2458a6}*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:var(--ink);font-family:Arial,sans-serif;line-height:1.55}button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}.head,main{max-width:1150px;margin:auto}.head{padding:11px 15px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.brand small{display:block;color:var(--mut);font-size:12px}.head button,.bar button,.nav button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px}.head button{margin-left:5px}main{padding:18px 14px 45px}.hero,.bar,aside,article{background:#fff;border:1px solid var(--line);border-radius:18px}.hero{padding:22px;margin-bottom:12px}.hero h1{margin:0 0 7px;font-size:clamp(28px,4vw,40px)}.hero p{margin:0;color:var(--mut)}.bar{padding:9px;margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap}.bar input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:9px}.bar .on{background:#18212b;color:#fff}.themes{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.themes button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px}.themes .on{background:#18212b;color:#fff}.layout{display:grid;grid-template-columns:285px 1fr;gap:15px}aside{padding:9px;max-height:calc(100vh - 85px);overflow:auto;position:sticky;top:70px}.item{width:100%;text-align:left;border:1px solid transparent;background:#f8fafb;border-radius:10px;padding:10px;margin-bottom:7px}.item.on{background:#edf4ff;border-color:#bfd2ef}.item b{display:block}.item small{color:var(--mut)}article{overflow:hidden}.cover{padding:20px 22px 12px;border-bottom:1px solid var(--line)}.badge{display:inline-block;background:#eef2f6;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}.cover h2{font-size:clamp(26px,4vw,38px);line-height:1.1;margin:9px 0 5px}.sub{color:var(--mut);font-size:13px}.sub button{border:0;background:none;color:var(--blue);font-weight:700}figure{margin:0;padding:16px 22px 0}figure img{display:block;width:100%;max-height:470px;object-fit:contain;border:1px solid #ccd3da;border-radius:10px;background:#fff}.paper{margin:16px 22px 0;border:1px solid #cfd5dc;border-radius:8px;padding:22px 26px;font-family:Georgia,'Times New Roman',serif;font-size:var(--fs);line-height:1.8}.paper p{margin:0 0 15px;padding-left:11px;border-left:3px solid #e5e9ee}.paper p:last-child{margin:0}.label{font:800 10px Arial,sans-serif;display:inline-block;border:1px solid #ccd4dc;border-radius:4px;background:#f7f8fa;padding:3px 5px;color:#566473}body.no-structure .paper p{border-left:0;padding-left:0}body.no-structure .label{display:none}.learn{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;padding:16px 22px}.card{border:1px solid var(--line);background:#fbfcfd;border-radius:12px;padding:13px}.card h3{margin:0 0 8px;font-size:15px}.vocab{display:grid;grid-template-columns:1fr 1fr;gap:6px}.vocab div{border-bottom:1px dotted #ccd3da;padding:4px 0}.vocab span{color:var(--mut);font-size:13px;margin-left:5px}.nav{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:8px 22px 20px}.done{background:#246643!important;color:#fff!important}body.big{--fs:21px}@media(max-width:820px){.layout{grid-template-columns:1fr}aside{position:static;max-height:none;display:grid;grid-template-columns:1fr 1fr;gap:7px}.item{margin:0}.learn{grid-template-columns:1fr}}@media(max-width:570px){main{padding:9px 7px 28px}.hero{padding:16px}aside{grid-template-columns:1fr}.cover{padding:17px 12px 10px}figure{padding:10px 7px 0}.paper{margin:10px 7px 0;padding:15px;line-height:1.7}.learn{padding:11px 7px}.vocab{grid-template-columns:1fr}.nav{padding:8px 7px 15px;grid-template-columns:1fr 1fr}#done{grid-column:1/-1;grid-row:1}}@media print{@page{size:A4 portrait;margin:12mm}header,.hero,.bar,.themes,aside,.sub,.nav{display:none!important}main{padding:0}.layout{display:block}article{border:0}.cover{padding:0;border:0}.cover h2{text-align:center;font-size:20pt}figure{padding:4px 0 8px}figure img{max-height:88mm}.paper{margin:0;padding:0;border:0;font-size:12pt;line-height:1.55}.paper p{border:0;padding:0}.learn{padding:10px 0 0;grid-template-columns:1fr 1fr}}</style></head><body><header><div class="head"><div class="brand">e-Karangan BM Tahun 4<small>SJKC · Koleksi mengikut tema</small></div><div><button id="font">A+</button><button id="print">🖨️</button></div></div></header><main><section class="hero"><h1>Belajar karangan dengan grafik dan struktur yang jelas.</h1><p>Pilih tajuk, baca versi mudah atau standard dan ulang kaji kosa kata BM–中文.</p></section><div class="bar"><input id="search" placeholder="Cari tajuk atau tema…"><button id="std" class="on">Standard</button><button id="easy">Mudah 简易</button><button id="structure">Struktur ON</button></div><div id="themes" class="themes"></div><div class="layout"><aside id="list"></aside><article><div class="cover"><span id="theme" class="badge"></span><h2 id="title"></h2><div class="sub"><span id="wc"></span> · <button id="copy">🔗 Salin pautan</button></div></div><figure><img id="img" alt=""></figure><section id="paper" class="paper"></section><section class="learn"><div class="card"><h3>Peribahasa / Frasa</h3><b id="phrase"></b><div id="note"></div></div><div class="card"><h3>Perbendaharaan Kata 词汇</h3><div id="vocab" class="vocab"></div></div></section><div class="nav"><button id="prev">← Sebelumnya</button><button id="done">✓ Tandakan sudah baca</button><button id="next">Seterusnya →</button></div></article></div></main><script>const E=[{id:'gotong',theme:'Kekeluargaan',title:'Bergotong-royong Membersihkan Rumah',image:'images/gotong.svg',phrase:'ringan tulang',note:'Rajin membantu dan bekerja.',vocab:[['bergotong-royong','齐心合作'],['menceriakan','美化'],['menyapu','扫'],['mengeratkan','加强关系']],standard:['Pada cuti persekolahan yang lalu, kami sekeluarga bergotong-royong membersihkan rumah untuk menceriakan kawasan kediaman kami. Suasana di rumah sangat meriah.','Mula-mula, kami sekeluarga membersihkan kawasan luar rumah dengan ringan tulang. Ayah menyapu daun kering di halaman rumah dengan sebatang penyapu lidi.','Selain itu, aktiviti diteruskan di dalam rumah. Abang menyusun buku-buku lama di atas rak kayu dengan teratur supaya kelihatan kemas.','Seterusnya, kami berehat bersama-sama. Ibu menghidangkan minuman petang yang enak di atas meja makan untuk kami sekeluarga.','Kesimpulannya, amalan bergotong-royong dapat mencantikkan rumah serta mengeratkan hubungan kekeluargaan. Saya berasa gembira dapat membantu ibu bapa.'],easy:['Pada cuti sekolah, keluarga saya membersihkan rumah bersama-sama.','Mula-mula, ayah menyapu daun kering di halaman rumah.','Selain itu, abang menyusun buku di atas rak.','Seterusnya, ibu menyediakan minuman untuk kami.','Kesimpulannya, rumah menjadi bersih dan kami berasa gembira.']},{id:'berkelah',theme:'Kekeluargaan',title:'Berkelah Bersama Keluarga',image:'images/berkelah.svg',phrase:'ringan tulang',note:'Rajin membantu tanpa disuruh berkali-kali.',vocab:[['berkelah','野餐'],['but kereta','汽车后备箱'],['tikar mengkuang','草席'],['pesisir pantai','海滩边']],standard:['Pada hari Ahad yang lalu, ayah membawa kami sekeluarga berkelah di tepi pantai untuk merehatkan minda. Kami berasa sangat teruja.','Mula-mula, kami menurunkan barang-barang daripada but kereta dengan ringan tulang. Ayah membentangkan tikar mengkuang di bawah pokok yang rendang.','Selain itu, saya membina sebuah istana pasir yang cantik di pesisir pantai bersama adik tersayang.','Seterusnya, kami berehat sambil mengisi perut yang lapar. Ibu menghidangkan mi goreng yang lazat di atas tikar untuk dinikmati bersama-sama.','Kesimpulannya, perkelahan ini dapat mengeratkan hubungan antara ahli keluarga. Saya berasa gembira dapat meluangkan masa bersama keluarga.'],easy:['Pada hari Ahad, keluarga saya berkelah di tepi pantai.','Mula-mula, kami menurunkan barang dari kereta. Ayah membentangkan tikar.','Selain itu, saya dan adik membina istana pasir.','Seterusnya, ibu menyediakan mi goreng untuk kami makan.','Kesimpulannya, kami berasa gembira dapat berkelah bersama.']},{id:'kitar',theme:'Kemasyarakatan',title:'Program Kitar Semula di Kawasan Perumahan',image:'images/kitar.svg',phrase:'ringan tulang',note:'Rajin membantu dalam sesuatu pekerjaan.',vocab:[['kitar semula','回收'],['mengasingkan','分类'],['tempat pengumpulan','收集处'],['alam sekitar','环境']],standard:['Pada hari Ahad yang lalu, penduduk di kawasan perumahan saya menyertai program kitar semula. Program ini diadakan pada waktu pagi.','Mula-mula, penduduk membawa barang kitar semula seperti kertas, botol plastik dan tin minuman. Mereka datang ke tempat pengumpulan dengan gembira.','Selain itu, saya dan keluarga membantu mengasingkan barang-barang tersebut. Kami bekerjasama dengan ringan tulang.','Seterusnya, program ini dapat menjaga kebersihan kawasan perumahan. Penduduk juga dapat belajar mencintai alam sekitar.','Kesimpulannya, saya berasa seronok kerana dapat menyertai program ini. Saya berharap program seperti ini akan diadakan lagi.'],easy:['Pada hari Ahad, kawasan rumah saya mengadakan program kitar semula.','Mula-mula, penduduk membawa kertas, botol plastik dan tin.','Selain itu, saya membantu mengasingkan barang-barang tersebut.','Seterusnya, kawasan perumahan menjadi lebih bersih.','Kesimpulannya, saya gembira dapat menjaga alam sekitar.']},{id:'kebersihan',theme:'Kesihatan dan Kebersihan',title:'Menjaga Kebersihan Diri',image:'images/kebersihan.svg',phrase:'Kebersihan membawa kesihatan.',note:'Frasa mudah tentang kepentingan kebersihan.',vocab:[['kebersihan','卫生'],['menggosok gigi','刷牙'],['kerosakan gigi','牙齿损坏'],['kuman','细菌']],standard:['Kita perlu menjaga kebersihan diri supaya badan sentiasa bersih dan sihat. Kita juga akan berasa lebih selesa ketika belajar dan bermain.','Mula-mula, kita perlu menggosok gigi sekurang-kurangnya dua kali sehari. Gigi yang bersih dapat mengelakkan kerosakan gigi.','Selain itu, kita perlu mandi setiap hari menggunakan sabun. Mandi dapat membersihkan kotoran pada badan.','Seterusnya, kita perlu mencuci tangan dengan sabun sebelum makan. Tangan yang bersih dapat mengelakkan kuman.','Kesimpulannya, kita mesti menjaga kebersihan diri setiap hari supaya sentiasa sihat dan ceria.'],easy:['Kita mesti menjaga kebersihan diri supaya badan sihat.','Mula-mula, kita perlu menggosok gigi setiap hari.','Selain itu, kita perlu mandi dengan sabun.','Seterusnya, kita perlu mencuci tangan sebelum makan.','Kesimpulannya, badan yang bersih menjadikan kita sihat dan ceria.']},{id:'kantin',theme:'Keusahawanan dan Pengurusan Kewangan',title:'Hari Kantin',image:'images/kantin.svg',phrase:'sedikit-sedikit, lama-lama menjadi bukit',note:'Simpanan sedikit boleh menjadi banyak jika dilakukan berterusan.',vocab:[['gerai jualan','摊位'],['pelanggan','顾客'],['baki wang','找钱；余额'],['berjimat','节省']],standard:['Pada hari Sabtu yang lalu, sekolah saya mengadakan Hari Kantin. Sejak awal pagi, suasana sekolah sangat meriah dengan pelbagai gerai jualan.','Mula-mula, saya membantu guru menyusun makanan dan minuman di gerai. Saya juga melayan pelanggan dengan mesra dan sopan.','Selain itu, saya belajar mengira wang ketika menerima bayaran daripada pelanggan. Saya memastikan baki wang dipulangkan dengan betul.','Seterusnya, hasil jualan disimpan dengan cermat. Guru mengingatkan kami supaya berjimat kerana sedikit-sedikit, lama-lama menjadi bukit.','Kesimpulannya, Hari Kantin memberikan pengalaman yang menarik. Saya belajar berniaga, mengurus wang dan bekerjasama dengan rakan-rakan.'],easy:['Pada hari Sabtu, sekolah saya mengadakan Hari Kantin.','Mula-mula, saya membantu menjual makanan dan minuman.','Selain itu, saya belajar mengira wang dan memberi baki.','Seterusnya, kami menyimpan wang hasil jualan dengan baik.','Kesimpulannya, saya belajar cara berniaga dan mengurus wang.']},{id:'teknologi',theme:'Sains, Teknologi dan Inovasi',title:'Pembelajaran Menggunakan Teknologi',image:'images/teknologi.svg',phrase:'usaha tangga kejayaan',note:'Kejayaan dapat dicapai melalui usaha bersungguh-sungguh.',vocab:[['teknologi','科技'],['projektor','投影仪'],['maklumat','资料'],['dalam talian','在线']],standard:['Pada masa kini, teknologi banyak digunakan di sekolah. Teknologi membantu murid belajar dengan lebih mudah dan menjadikan pelajaran lebih menarik.','Mula-mula, guru menggunakan komputer dan projektor semasa mengajar. Murid dapat melihat gambar dan video dengan jelas.','Selain itu, murid boleh menggunakan tablet atau komputer untuk mencari maklumat. Murid juga boleh membuat latihan dalam talian.','Seterusnya, murid boleh menjawab kuiz menggunakan teknologi. Aktiviti ini menjadikan pembelajaran lebih seronok.','Kesimpulannya, teknologi banyak membantu kita belajar. Kita mesti menggunakannya dengan baik kerana usaha tangga kejayaan.'],easy:['Teknologi banyak digunakan di sekolah pada masa kini.','Mula-mula, guru menggunakan komputer dan projektor untuk mengajar.','Selain itu, murid boleh mencari maklumat menggunakan tablet.','Seterusnya, murid boleh menjawab kuiz dalam talian.','Kesimpulannya, teknologi membantu kita belajar dengan lebih mudah.']},{id:'alam',theme:'Kelestarian Alam',title:'Cara Menjaga Alam Sekitar',image:'images/alam.svg',phrase:'Alam bersih, hidup sihat.',note:'Frasa ringkas tentang kepentingan alam sekitar.',vocab:[['alam sekitar','环境'],['mencemarkan','污染'],['menanam pokok','种树'],['nyaman','舒适']],standard:['Kita perlu menjaga alam sekitar supaya kawasan tempat tinggal sentiasa bersih dan indah. Alam sekitar yang bersih juga menjadikan hidup kita lebih sihat.','Mula-mula, kita perlu membuang sampah ke dalam tong sampah. Sikap ini dapat menjaga kebersihan kawasan sekeliling.','Selain itu, kita tidak boleh membakar sampah secara terbuka. Asap daripada pembakaran boleh mencemarkan udara.','Seterusnya, kita perlu menanam pokok di kawasan rumah atau sekolah. Pokok dapat mencantikkan kawasan dan menyegarkan udara.','Kesimpulannya, kita mesti menjaga alam sekitar setiap hari. Kita hendaklah bekerjasama supaya alam sekitar sentiasa bersih dan nyaman.'],easy:['Kita perlu menjaga alam sekitar supaya sentiasa bersih.','Mula-mula, kita perlu membuang sampah ke dalam tong sampah.','Selain itu, kita tidak boleh membakar sampah.','Seterusnya, kita boleh menanam pokok di rumah atau sekolah.','Kesimpulannya, alam yang bersih menjadikan hidup kita lebih sihat.']}];const L=['Pendahuluan','Isi 1','Isi 2','Isi 3','Penutup'],$=x=>document.getElementById(x);let mode='standard',filter='Semua',q='',id=location.hash.slice(1)||E[0].id,structure=true,read=new Set(JSON.parse(localStorage.getItem('ebook-read')||'[]'));const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function active(){return E.find(e=>e.id===id)||E[0]}function list(){let z=q.toLowerCase();return E.filter(e=>(filter==='Semua'||e.theme===filter)&&(!z||(e.title+' '+e.theme).toLowerCase().includes(z)))}function renderThemes(){let t=['Semua',...new Set(E.map(e=>e.theme))];$('themes').innerHTML=t.map(x=>`<button class="${x===filter?'on':''}" data-t="${esc(x)}">${esc(x)}</button>`).join('');$('themes').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.t;renderThemes();renderList()})}function renderList(){$('list').innerHTML=list().map(e=>`<button class="item ${e.id===id?'on':''}" data-id="${e.id}"><b>${esc(e.title)}</b><small>${esc(e.theme)}${read.has(e.id)?' · ✓ dibaca':''}</small></button>`).join('')||'<p>Tiada tajuk ditemui.</p>';$('list').querySelectorAll('.item').forEach(b=>b.onclick=()=>select(b.dataset.id,true))}function render(){let e=active(),p=e[mode];$('theme').textContent=e.theme;$('title').textContent=e.title;$('wc').textContent=p.join(' ').trim().split(/\s+/).length+' patah perkataan';$('img').src=e.image;$('img').alt='Grafik '+e.title;$('paper').innerHTML=p.map((x,i)=>`<p><span class="label">${L[i]}</span><br>${esc(x)}</p>`).join('');$('phrase').textContent=e.phrase;$('note').textContent=e.note;$('vocab').innerHTML=e.vocab.map(v=>`<div><b>${esc(v[0])}</b><span>${esc(v[1])}</span></div>`).join('');$('done').classList.toggle('done',read.has(e.id));$('done').textContent=read.has(e.id)?'✓ Sudah dibaca':'✓ Tandakan sudah baca';let i=E.findIndex(x=>x.id===id);$('prev').disabled=i===0;$('next').disabled=i===E.length-1;document.title=e.title+' · e-Karangan BM Tahun 4'}function select(x,s){id=E.some(e=>e.id===x)?x:E[0].id;history.replaceState(null,'','#'+id);renderList();render();if(s)document.querySelector('article').scrollIntoView({behavior:'smooth'})}$('search').oninput=e=>{q=e.target.value;renderList()};$('std').onclick=()=>{mode='standard';$('std').classList.add('on');$('easy').classList.remove('on');render()};$('easy').onclick=()=>{mode='easy';$('easy').classList.add('on');$('std').classList.remove('on');render()};$('structure').onclick=()=>{structure=!structure;document.body.classList.toggle('no-structure',!structure);$('structure').textContent='Struktur '+(structure?'ON':'OFF')};$('font').onclick=()=>{document.body.classList.toggle('big');$('font').textContent=document.body.classList.contains('big')?'A−':'A+'};$('print').onclick=()=>print();$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);alert('Pautan disalin.')}catch{}};$('done').onclick=()=>{read.has(id)?read.delete(id):read.add(id);localStorage.setItem('ebook-read',JSON.stringify([...read]));renderList();render()};$('prev').onclick=()=>{let i=E.findIndex(x=>x.id===id);if(i>0)select(E[i-1].id,true)};$('next').onclick=()=>{let i=E.findIndex(x=>x.id===id);if(i<E.length-1)select(E[i+1].id,true)};renderThemes();select(id,false);</script></body></html>
